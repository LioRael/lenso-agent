[package]
name = "lenso-agent-cli"
version = "0.1.0"
description = "Headless CLI Runner for the Lenso Agent Harness."
default-run = "lenso-agent-cli"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "lenso-agent-cli"
path = "src/main.rs"

[[bin]]
name = "lenso-agent"
path = "src/tui_main.rs"

[[bin]]
name = "lenso-agent-telegram"
path = "src/telegram_main.rs"

[[bin]]
name = "lenso-agent-discord"
path = "src/discord_main.rs"

[[bin]]
name = "lenso-agent-channel"
path = "src/channel_main.rs"

