[package]
name = "lenso-agent-cli"
version = "0.1.0"
description = "Headless command-line surface for Lenso Agent."
default-run = "lenso-agent-cli"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "lenso-agent-cli"
path = "src/main.rs"

[dependencies]
clap.workspace = true
lenso-agent-approval-hook-plugin = { path = "../../crates/lenso-agent-approval-hook-plugin" }
lenso-agent-auth-openai-codex-plugin = { path = "../../crates/lenso-agent-auth-openai-codex-plugin" }
lenso-agent-cli-plugin = { path = "../../crates/lenso-agent-cli-plugin" }
lenso-agent-default-plugins = { path = "../../crates/lenso-agent-default-plugins" }
lenso-agent-host = { path = "../../crates/lenso-agent-host" }
lenso-agent-loop-plugin = { path = "../../crates/lenso-agent-loop-plugin" }
lenso-agent-session-file-plugin = { path = "../../crates/lenso-agent-session-file-plugin" }
lenso-capability-agent = { path = "../../crates/lenso-capability-agent" }
lenso-capability-agent-context-source = { path = "../../crates/lenso-capability-agent-context-source" }
lenso-kernel.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
uuid.workspace = true
zip.workspace = true

[dev-dependencies]
lenso-agent-session-inspection = { path = "../../crates/lenso-agent-session-inspection" }
lenso-agent-session-sqlite-plugin = { path = "../../crates/lenso-agent-session-sqlite-plugin" }
lenso-plugin-control-plane.workspace = true
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
