[package]
name = "lenso-agent-web"
version = "0.1.0"
description = "HTTP and SSE surface for the Lenso Agent Harness."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "lenso-agent-web"
path = "src/main.rs"
required-features = ["standalone"]

[[bin]]
name = "lenso-plugin-configuration-service"
path = "src/configuration_service_main.rs"

[lib]
name = "lenso_agent_web"
path = "src/lib.rs"

[features]
default = ["standalone"]
standalone = ["dep:lenso-agent-default-plugins"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
futures.workspace = true
fs2.workspace = true
lenso-agent-default-plugins = { path = "../../crates/lenso-agent-default-plugins", optional = true }
lenso-agent-host = { path = "../../crates/lenso-agent-host" }
lenso-agent-loop-plugin = { path = "../../crates/lenso-agent-loop-plugin" }
lenso-agent-session-inspection = { path = "../../crates/lenso-agent-session-inspection" }
lenso-agent-web-plugin = { path = "../../crates/lenso-agent-web-plugin" }
lenso-app-authoring.workspace = true
lenso-app-plan.workspace = true
lenso-capability-agent = { path = "../../crates/lenso-capability-agent" }
lenso-capability-agent-session = { path = "../../crates/lenso-capability-agent-session" }
lenso-capability-agent-task-supervisor = { path = "../../crates/lenso-capability-agent-task-supervisor" }
lenso-capability-agent-user-interaction = { path = "../../crates/lenso-capability-agent-user-interaction" }
lenso-kernel.workspace = true
lenso-plugin-control-plane.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tower.workspace = true
uuid.workspace = true

[lints]
workspace = true

[dev-dependencies]
lenso-agent-console-plugins = { path = "../../crates/lenso-agent-console-plugins" }
tempfile.workspace = true
