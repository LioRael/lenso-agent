[package]
name = "lenso-agent-channel"
version = "0.1.0"
description = "Optional Telegram and Discord ingress surfaces for the Lenso Agent Harness."
default-run = "lenso-agent-channel"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "lenso-agent-channel"
path = "src/main.rs"

[[bin]]
name = "lenso-agent-telegram"
path = "src/bin/lenso-agent-telegram.rs"

[[bin]]
name = "lenso-agent-discord"
path = "src/bin/lenso-agent-discord.rs"

[dependencies]
clap.workspace = true
futures.workspace = true
lenso-agent-default-plugins = { path = "../../crates/lenso-agent-default-plugins" }
lenso-agent-discord-plugin = { path = "../../crates/lenso-agent-discord-plugin" }
lenso-agent-host = { path = "../../crates/lenso-agent-host" }
lenso-agent-loop-plugin = { path = "../../crates/lenso-agent-loop-plugin" }
lenso-agent-telegram-plugin = { path = "../../crates/lenso-agent-telegram-plugin" }
lenso-capability-agent = { path = "../../crates/lenso-capability-agent" }
lenso-kernel.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
toml.workspace = true
uuid.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
