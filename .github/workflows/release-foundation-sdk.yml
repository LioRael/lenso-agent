name: Release Foundation SDK

on:
  push:
    branches: ["delta/verify/**"]
    paths:
      - ".github/workflows/release-foundation-sdk.yml"
      - "scripts/foundation-sdk-packages.sh"
      - "crates/lenso-capability-agent-model/**"
      - "crates/lenso-capability-agent-turn-processing/**"
      - "crates/lenso-capability-agent-extension-state/**"
      - "crates/lenso-capability-agent-interaction/**"
      - "crates/lenso-capability-agent-dynamic-authority/**"
      - "crates/lenso-capability-agent-durable-task/**"
  workflow_dispatch:
    inputs:
      revision:
        description: Exact reviewed main commit SHA
        required: true
        type: string
      publish:
        description: Publish the six Foundation SDK packages through Trusted Publishing
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: foundation-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Validate release revision
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$REQUESTED_REVISION" = "$GITHUB_SHA"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-10
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - run: bash scripts/foundation-sdk-packages.sh test
      - run: bash scripts/foundation-sdk-packages.sh verify

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-10
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      - name: Publish the closed cohort in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: bash scripts/foundation-sdk-packages.sh publish
      - name: Verify registry consumer
        run: |
          version=$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("crates/lenso-capability-agent-model/Cargo.toml").read_text())["package"]["version"])')
          python3 scripts/verify-foundation-sdk-registry.py --version "$version"
