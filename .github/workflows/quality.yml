name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  static:
    name: Format, check, and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Check product identity
        run: |
          former_repository='lenso-agent-''harness'
          former_product='Lenso Agent ''Harness'
          if git grep -n -I -E "${former_repository}|${former_product}" -- . \
            ':!docs/adr/**' \
            ':!docs/research/**'; then
            echo "active product files still use the former Lenso Agent identity" >&2
            exit 1
          fi
      - name: Check release scripts
        run: |
          bash -n scripts/*.sh
          ./scripts/check-release-version.sh 0.1.0
          ./scripts/test-release-packaging.sh
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: nightly-2026-07-10
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check every target
        run: cargo check --locked --workspace --all-targets
      - name: Lint every target
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  tests:
    name: Workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: nightly-2026-07-10
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install Linux coding profile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap ripgrep
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-net /bin/true
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Test the workspace
        run: cargo test --locked --workspace --all-targets

  contracts:
    name: Generated contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: nightly-2026-07-10
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install the pinned contract generator
        run: >-
          cargo install --locked
          --git https://github.com/LioRael/lenso-protocols
          --rev 9d2774c767fd64a6cc63a5ac04360e9cb92816da
          lenso-contract-codegen
      - name: Check generated contracts
        run: lenso-contract-codegen workspace check --manifest-path Cargo.toml
