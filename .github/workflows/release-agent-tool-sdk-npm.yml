name: Release Agent Tool TypeScript SDK

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full SHA of the reviewed source on main
        required: true
        type: string
      version:
        description: Exact reviewed SDK version
        required: true
        type: string
      mode:
        description: Dry-run prepares the archive; publication requires separate authorization
        required: true
        default: dry-run
        type: choice
        options: [dry-run, publish]
      publish_confirmation:
        description: Enter publish only for an authorized publication
        required: false
        default: ""
        type: string
      reviewed_archive_sha256:
        description: SHA-256 of the archive from the reviewed dry-run
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: agent-tool-sdk-npm
  cancel-in-progress: false

jobs:
  verify:
    name: Verify @lenso/agent-tool-sdk
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      archive_sha256: ${{ steps.pack.outputs.sha256 }}
    env:
      RELEASE_SHA: ${{ inputs.source_sha }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_CONFIRMATION: ${{ inputs.publish_confirmation }}
      REVIEWED_SHA256: ${{ inputs.reviewed_archive_sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source, version and mode
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$RELEASE_MODE" = dry-run || test "$RELEASE_MODE" = publish
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          if [[ "$RELEASE_MODE" == publish ]]; then
            test "$GITHUB_REF" = refs/heads/main
            test "$RELEASE_CONFIRMATION" = publish
            [[ "$REVIEWED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.21
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - name: Verify package identity
        working-directory: packages/lenso-agent-tool-sdk
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const value = JSON.parse(fs.readFileSync("package.json"));
            if (value.name !== "@lenso/agent-tool-sdk" ||
                value.version !== process.env.RELEASE_VERSION || value.private)
              process.exit(1);
          '
      - name: Test starter prerequisite classifications
        run: python3 scripts/test-tool-starter-prerequisites.py
      - name: Install package dependencies
        working-directory: packages/lenso-agent-tool-sdk
        run: npm install --ignore-scripts --no-package-lock
      - name: Build and test package
        working-directory: packages/lenso-agent-tool-sdk
        run: |
          bun run build
          bun run test
          git diff --exit-code
      - name: Pack reviewed artifact
        id: pack
        working-directory: packages/lenso-agent-tool-sdk
        run: |
          mkdir -p "$RUNNER_TEMP/agent-sdk-release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/agent-sdk-release"
          shopt -s nullglob
          archives=("$RUNNER_TEMP"/agent-sdk-release/*.tgz)
          test "${#archives[@]}" -eq 1
          digest="$(sha256sum "${archives[0]}" | cut -d ' ' -f1)"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_MODE" == publish ]]; then
            test "$digest" = "$REVIEWED_SHA256"
          fi
          export ARCHIVE_SHA256="$digest"
          node --input-type=module -e '
            import fs from "node:fs";
            fs.writeFileSync(process.env.RUNNER_TEMP + "/agent-sdk-release/review.json",
              JSON.stringify({
                source_sha: process.env.RELEASE_SHA,
                package_name: "@lenso/agent-tool-sdk",
                version: process.env.RELEASE_VERSION,
                archive_sha256: process.env.ARCHIVE_SHA256,
                producer: { bun: "1.2.21", node: process.version },
              }, null, 2) + "\n");
          '
          npm publish "${archives[0]}" --dry-run --ignore-scripts --access public --provenance=false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-tool-sdk-npm
          path: ${{ runner.temp }}/agent-sdk-release/
          if-no-files-found: error

  publish:
    name: Publish @lenso/agent-tool-sdk
    if: ${{ github.ref == 'refs/heads/main' && inputs.mode == 'publish' && inputs.publish_confirmation == 'publish' }}
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: agent-tool-sdk-npm
          path: release-artifacts
      - name: Recheck source and reviewed archive
        env:
          RELEASE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_SHA256: ${{ needs.verify.outputs.archive_sha256 }}
          REVIEWED_SHA256: ${{ inputs.reviewed_archive_sha256 }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$REVIEWED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$EXPECTED_SHA256" = "$REVIEWED_SHA256"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          shopt -s nullglob
          archives=(release-artifacts/*.tgz)
          test "${#archives[@]}" -eq 1
          test "$(sha256sum "${archives[0]}" | cut -d ' ' -f1)" = "$REVIEWED_SHA256"
          node --input-type=module -e '
            import fs from "node:fs";
            const review = JSON.parse(fs.readFileSync("release-artifacts/review.json"));
            if (review.source_sha !== process.env.RELEASE_SHA ||
                review.package_name !== "@lenso/agent-tool-sdk" ||
                review.version !== process.env.RELEASE_VERSION ||
                review.archive_sha256 !== process.env.REVIEWED_SHA256)
              process.exit(1);
            const response = await fetch("https://registry.npmjs.org/@lenso%2Fagent-tool-sdk");
            if (!response.ok) throw new Error("Primary registry readback failed");
            const metadata = await response.json();
            if (Object.hasOwn(metadata.versions, process.env.RELEASE_VERSION))
              throw new Error("Requested version is already occupied");
          '
      - name: Publish reviewed archive
        run: npm publish ./release-artifacts/*.tgz --ignore-scripts --access public --provenance --registry=https://registry.npmjs.org/
