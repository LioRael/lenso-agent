name: Projects delegated-user acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/projects-acceptance/**'
      - '.github/workflows/projects-acceptance.yml'

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: agent
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lenso_test
          POSTGRES_PASSWORD: acceptance-only
          POSTGRES_DB: acceptance
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lenso_test -d acceptance"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          path: agent
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: LioRael/lenso-auth-plugin
          ref: b68d87654e18910e8d14649e48e3166636fa99a1
          path: acceptance-sources/auth
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: LioRael/lenso-organization-plugin
          ref: ea80c5fe0e77841e6b5c3f7d992ee7c603e8a7cd
          path: acceptance-sources/organization
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: LioRael/lenso-projects-plugin
          ref: 49cda8f405ce10c3d936a6a07d81dd07232b5157
          path: acceptance-sources/projects
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: LioRael/lenso-projects-web-plugin
          ref: df70768a71ab14772bc717f59c60bb1d6ee54c1d
          path: acceptance-sources/projects-web
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-10
      - name: Prepare actual business App
        run: |
          python3 scripts/projects-acceptance/prepare.py \
            --auth-root ../acceptance-sources/auth \
            --organization-root ../acceptance-sources/organization \
            --projects-root ../acceptance-sources/projects \
            --projects-web-root ../acceptance-sources/projects-web
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: agent/.lenso/projects-acceptance
      - name: Verify delegated identity and durable authorization
        env:
          LENSO_POSTGRES_TEST_URL: postgresql://lenso_test:acceptance-only@127.0.0.1:5432/acceptance
          LENSO_ACCEPTANCE_RECEIPT: .lenso/projects-acceptance/receipt.json
        run: |
          cargo build --manifest-path .lenso/projects-acceptance/Cargo.toml
          .lenso/projects-acceptance/target/debug/projects-browser-acceptance >.lenso/acceptance.log 2>&1 &
          fixture_pid=$!
          trap 'kill -INT "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            test ! -f "$LENSO_ACCEPTANCE_RECEIPT" || break
            kill -0 "$fixture_pid" || { cat .lenso/acceptance.log; exit 1; }
            sleep 1
          done
          python3 scripts/projects-acceptance/verify.py --receipt "$LENSO_ACCEPTANCE_RECEIPT"
          kill -INT "$fixture_pid"
          wait "$fixture_pid"
          trap - EXIT
