name: Release Rust Tool SDK cohort

on:
  pull_request:
    paths:
      - ".github/workflows/release-tool-sdk-crates.yml"
  workflow_dispatch:
    inputs:
      revision:
        description: Exact reviewed main commit SHA
        required: true
        type: string
      version:
        description: Exact SDK and macro version; Provider version comes from the SDK dependency
        required: true
        type: string
      publish:
        description: Publish all three packages to crates.io
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release-rust-tool-sdk
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-10
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Validate release versions
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, tomllib
          provider = tomllib.loads(pathlib.Path("crates/lenso-capability-agent-tool-provider/Cargo.toml").read_text())
          sdk = tomllib.loads(pathlib.Path("crates/lenso-agent-tool-sdk/Cargo.toml").read_text())
          macros = tomllib.loads(pathlib.Path("crates/lenso-agent-tool-sdk-macros/Cargo.toml").read_text())
          version = sdk["package"]["version"]
          assert version == macros["package"]["version"]
          assert version == sdk["dependencies"]["lenso-agent-tool-sdk-macros"]["version"]
          assert provider["package"]["version"] == sdk["dependencies"]["lenso-capability-agent-tool-provider"]["version"]
          requested = os.environ["REQUESTED_VERSION"]
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              assert requested == version, "Requested version does not match manifests"
              assert os.environ["GITHUB_REF"] == "refs/heads/main", "Release must run from main"
              assert os.environ["REQUESTED_REVISION"] == os.environ["GITHUB_SHA"], "Requested revision does not match the checked-out main commit"
          PYTHON
      - name: Test Tool authoring and contract
        run: cargo test --locked -p lenso-capability-agent-tool-provider -p lenso-agent-tool-sdk -p lenso-agent-tool-sdk-macros
      - name: Verify closed publishable cohort
        run: cargo package --locked -p lenso-capability-agent-tool-provider -p lenso-agent-tool-sdk-macros -p lenso-agent-tool-sdk
      - name: Verify Provider with registry-only Codec
        run: python3 scripts/verify-tool-provider-registry-package.py

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-10
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p lenso-capability-agent-tool-provider -p lenso-agent-tool-sdk-macros -p lenso-agent-tool-sdk
