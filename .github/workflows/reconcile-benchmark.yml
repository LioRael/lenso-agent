name: Reconciler benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: nightly-2026-07-10
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Run deterministic invariants and capture metrics
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p lenso-agent-web --test reconcile_benchmark \
            -- --ignored --nocapture --test-threads=1 | tee reconcile-benchmark.log
          grep -F '"schema":"lenso.agent.reconcile-benchmark.v1"' \
            reconcile-benchmark.log | tail -n 1 | sed 's/^[^{]*//' \
            > reconcile-benchmark.json
          jq -e '.schema == "lenso.agent.reconcile-benchmark.v1"' \
            reconcile-benchmark.json >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reconcile-benchmark-${{ github.sha }}
          path: reconcile-benchmark.json
          if-no-files-found: error
