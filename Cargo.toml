[workspace]
resolver = "2"
members = [
    "crates/lenso-capability-agent",
    "crates/lenso-capability-agent-model",
    "crates/lenso-capability-agent-tools",
    "crates/lenso-capability-agent-tool-provider",
    "crates/lenso-capability-agent-session",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/LioRael/lenso-agent-harness"
rust-version = "1.94"

[workspace.dependencies]
futures = "0.3"
lenso-contract-codegen = "0.5.1"
lenso-contract-runtime = "0.1.0"
lenso-kernel = "0.1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
