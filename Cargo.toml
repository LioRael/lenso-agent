[workspace]
resolver = "2"
members = [
    "apps/lenso-agent-cli",
    "crates/lenso-agent-auth-openai-codex-module",
    "crates/lenso-capability-agent",
    "crates/lenso-capability-agent-auth-openai-codex",
    "crates/lenso-capability-agent-model",
    "crates/lenso-capability-agent-prompt",
    "crates/lenso-capability-agent-prompt-provider",
    "crates/lenso-capability-agent-process",
    "crates/lenso-capability-agent-tools",
    "crates/lenso-capability-agent-tool-provider",
    "crates/lenso-capability-agent-session",
    "crates/lenso-agent-loop-module",
    "crates/lenso-agent-model-fixture-module",
    "crates/lenso-agent-model-openai-compatible-module",
    "crates/lenso-agent-model-openai-codex-direct-module",
    "crates/lenso-agent-native-support",
    "crates/lenso-agent-prompt-filesystem-module",
    "crates/lenso-agent-prompt-module",
    "crates/lenso-agent-prompt-static-module",
    "crates/lenso-agent-process-native-module",
    "crates/lenso-agent-process-tools-module",
    "crates/lenso-agent-session-file-module",
    "crates/lenso-agent-skills-filesystem-module",
    "crates/lenso-agent-tools-module",
    "crates/lenso-agent-text-tools-module",
    "crates/lenso-agent-module",
    "crates/lenso-agent-module-macros",
    "crates/lenso-agent-workspace-edit-module",
    "crates/lenso-agent-workspace-read-module",
    "crates/lenso-agent-cli-module",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/LioRael/lenso-agent-harness"
rust-version = "1.94"

[workspace.dependencies]
bytes = "1.11"
base64 = "0.22"
directories = "6.0"
fs2 = "0.4"
futures = "0.3"
lenso-agent-module = { path = "crates/lenso-agent-module" }
lenso-capability-secrets = { git = "https://github.com/LioRael/lenso-secrets-module.git", rev = "0057955f5b3ad234f051d05d90122e1eb4afc137" }
lenso-app-plan = "0.1.4"
lenso-contract-authoring = { git = "https://github.com/LioRael/lenso-protocols", rev = "d9ea9258f6595804e940f0419c5b4ddb18af790d" }
lenso-contract-codegen = { git = "https://github.com/LioRael/lenso-protocols", rev = "d9ea9258f6595804e940f0419c5b4ddb18af790d" }
lenso-contract-runtime = "0.1.0"
lenso-kernel = "0.1.8"
lenso-module-authoring = { git = "https://github.com/LioRael/lenso-protocols", rev = "d9ea9258f6595804e940f0419c5b4ddb18af790d" }
lenso-native-adapter = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "13906bb13f959450dfd9f30920dccd58901fefd6" }
lenso-plugin-control-plane = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "13906bb13f959450dfd9f30920dccd58901fefd6" }
lenso-runner = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "13906bb13f959450dfd9f30920dccd58901fefd6" }
nix = { version = "0.31", features = ["process", "signal"] }
lenso-secrets-env-module = { git = "https://github.com/LioRael/lenso-secrets-module.git", rev = "0057955f5b3ad234f051d05d90122e1eb4afc137" }
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls", "stream"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.48", features = ["io-util", "macros", "net", "process", "rt", "signal", "time"] }
uuid = { version = "1.18", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
single_match_else = "allow"

[patch.crates-io]
# Keep external native Module packages on the exact Runtime trait identity used
# by this host until the plugin Runtime revision is published as ordinary crates.
lenso-native-adapter = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "13906bb13f959450dfd9f30920dccd58901fefd6" }
