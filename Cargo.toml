[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/LioRael/lenso-agent"
rust-version = "1.94"

[workspace.dependencies]
agent-client-protocol = "2.0.0"
anyhow = "1"
bytes = "1.11"
axum = "0.8"
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "string"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0"
fs2 = "0.4"
futures = "0.3"
proc-macro2 = "1"
quote = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
lenso-capability-secrets = "0.1.4"
lenso-app-authoring = { package = "lenso-cli", version = "0.6.5", default-features = false }
lenso-app-plan = "0.4.6"
lenso-bun-adapter = "0.1.17"
lenso = "0.5.28"
lenso-contract-authoring = "0.1.2"
lenso-contract-codegen = "=0.10.1"
lenso-contract-runtime = "0.2.0"
lenso-capability-management = { git = "https://github.com/LioRael/lenso-console", rev = "ed1cfec08808dd38e068148224256b663d31fd44" }
lenso-guest-sdk = "0.5.1"
lenso-kernel = "0.3.12"
lenso-plugin-authoring = "0.2.0"
lenso-native-adapter = "0.3.19"
lenso-plugin-bundle = "0.6.1"
lenso-plugin-control-plane = "0.4.26"
lenso-quickjs-adapter = "0.2.11"
lenso-runner = "0.2.20"
lenso-runtime-codec = "0.4.4"
lenso-capability-terminal-command-provider = "0.1.1"
lenso-capability-terminal-command = "0.1.1"
lenso-terminal-command-plugin = "0.1.1"
lenso-terminal-cli-plugin = "0.1.1"
lenso-terminal-cli-surface = "0.1.1"
lenso-wasm-component-adapter = "0.2.18"
mlua = { version = "0.11", features = ["async", "lua54", "serialize", "vendored"] }
nix = { version = "0.31", features = ["process", "signal"] }
notify = "8.2"
lenso-secrets-command-plugin = "0.1.4"
lenso-secrets-encrypted-file-plugin = "0.1.4"
lenso-secrets-env-plugin = "0.1.7"
lenso-secrets-keychain-plugin = "0.1.4"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"
jsonschema = { version = "0.51", default-features = false }
syn = { version = "2", features = ["full"] }
sha2 = { version = "0.10", features = ["asm"] }
tempfile = "3.23"
time = { version = "0.3", features = ["formatting", "local-offset"] }
tokio = { version = "1.48", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml = "0.9"
tower = { version = "0.5", features = ["limit"] }
uuid = { version = "1.18", features = ["v4"] }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
single_match_else = "allow"

# Each surface links a complete Host. Optimize across crate boundaries and omit
# symbols from shipped executables; retain the default panic-unwind behavior.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Host startup verifies large debug executables; keep that integrity path fast.
[profile.dev.package.sha2]
opt-level = 3

