[workspace]
resolver = "2"
members = [
    "apps/lenso-agent-cli",
    "crates/lenso-agent-auth-openai-codex-module",
    "crates/lenso-capability-agent",
    "crates/lenso-capability-agent-auth-openai-codex",
    "crates/lenso-capability-agent-model",
    "crates/lenso-capability-agent-prompt",
    "crates/lenso-capability-agent-prompt-provider",
    "crates/lenso-capability-agent-process",
    "crates/lenso-capability-agent-http-fetch",
    "crates/lenso-capability-agent-tool-hook",
    "crates/lenso-capability-agent-workspace-read",
    "crates/lenso-capability-agent-tools",
    "crates/lenso-capability-agent-tool-provider",
    "crates/lenso-capability-agent-tool-progress",
    "crates/lenso-capability-agent-session",
    "crates/lenso-capability-agent-tui-contribution",
    "crates/lenso-capability-agent-tui-suggestion",
    "crates/lenso-agent-loop-module",
    "crates/lenso-agent-model-fixture-module",
    "crates/lenso-agent-model-openai-compatible-module",
    "crates/lenso-agent-model-openai-codex-direct-module",
    "crates/lenso-agent-native-support",
    "crates/lenso-agent-prompt-filesystem-module",
    "crates/lenso-agent-prompt-module",
    "crates/lenso-agent-prompt-static-module",
    "crates/lenso-agent-process-native-module",
    "crates/lenso-agent-process-tools-module",
    "crates/lenso-agent-session-file-module",
    "crates/lenso-agent-skills-filesystem-module",
    "crates/lenso-agent-subagent-tools-module",
    "crates/lenso-agent-tools-module",
    "crates/lenso-agent-text-tools-module",
    "crates/lenso-agent-tool-sdk",
    "crates/lenso-agent-tool-sdk-macros",
    "crates/lenso-agent-workspace-edit-module",
    "crates/lenso-agent-workspace-import-read-module",
    "crates/lenso-agent-workspace-read-tools-module",
    "crates/lenso-agent-http-fetch-module",
    "crates/lenso-agent-workspace-read-module",
    "crates/lenso-agent-cli-module",
    "crates/lenso-agent-approval-hook-module",
    "crates/lenso-agent-code-mode-tools-module",
    "crates/lenso-agent-tui-module",
    "crates/lenso-agent-tui-static-module",
    "crates/lenso-agent-telegram-module",
    "crates/lenso-agent-discord-module",
    "crates/lenso-agent-tui-command-suggestions-module",
    "crates/lenso-agent-tui-workspace-suggestions-module",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/LioRael/lenso-agent-harness"
rust-version = "1.94"

[workspace.dependencies]
bytes = "1.11"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0"
fs2 = "0.4"
futures = "0.3"
proc-macro2 = "1"
quote = "1"
lenso-capability-secrets = "0.1.1"
lenso-app-plan = "0.2.0"
lenso = "0.4.2"
lenso-contract-authoring = { git = "https://github.com/LioRael/lenso-protocols", rev = "8a9b2482278224973417aaac1fd925ba1cfa5370" }
lenso-contract-codegen = { git = "https://github.com/LioRael/lenso-protocols", rev = "8a9b2482278224973417aaac1fd925ba1cfa5370" }
lenso-contract-runtime = "0.1.3"
lenso-guest-sdk = "0.1.2"
lenso-kernel = "0.1.12"
lenso-module-authoring = "0.1.1"
lenso-native-adapter = "0.2.3"
lenso-plugin-bundle = "0.1.2"
lenso-plugin-control-plane = "0.1.2"
lenso-quickjs-adapter = "0.1.2"
lenso-runner = "0.1.9"
lenso-runtime-codec = "0.1.2"
lenso-wasm-component-adapter = "0.1.2"
mlua = { version = "0.11", features = ["async", "lua54", "serialize", "vendored"] }
nix = { version = "0.31", features = ["process", "signal"] }
lenso-secrets-env-module = "0.1.1"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls", "stream"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2", features = ["full"] }
sha2 = { version = "0.10", features = ["asm"] }
tempfile = "3.23"
time = { version = "0.3", features = ["formatting", "local-offset"] }
tokio = { version = "1.48", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml = "0.9"
uuid = { version = "1.18", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
single_match_else = "allow"

# Host startup verifies large debug executables; keep that integrity path fast.
[profile.dev.package.sha2]
opt-level = 3
