[workspace]
resolver = "2"
members = [
    "apps/lenso-agent-cli",
    "crates/lenso-agent-auth-openai-codex-module",
    "crates/lenso-capability-agent",
    "crates/lenso-capability-agent-auth-openai-codex",
    "crates/lenso-capability-agent-model",
    "crates/lenso-capability-agent-prompt",
    "crates/lenso-capability-agent-prompt-provider",
    "crates/lenso-capability-agent-process",
    "crates/lenso-capability-agent-tools",
    "crates/lenso-capability-agent-tool-provider",
    "crates/lenso-capability-agent-session",
    "crates/lenso-agent-loop-module",
    "crates/lenso-agent-model-fixture-module",
    "crates/lenso-agent-model-openai-compatible-module",
    "crates/lenso-agent-model-openai-codex-direct-module",
    "crates/lenso-agent-native-support",
    "crates/lenso-agent-prompt-filesystem-module",
    "crates/lenso-agent-prompt-module",
    "crates/lenso-agent-prompt-static-module",
    "crates/lenso-agent-process-native-module",
    "crates/lenso-agent-process-tools-module",
    "crates/lenso-agent-session-file-module",
    "crates/lenso-agent-skills-filesystem-module",
    "crates/lenso-agent-tools-module",
    "crates/lenso-agent-text-tools-module",
    "crates/lenso-agent-module",
    "crates/lenso-agent-module-macros",
    "crates/lenso-agent-workspace-edit-module",
    "crates/lenso-agent-workspace-read-module",
    "crates/lenso-agent-cli-module",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/LioRael/lenso-agent-harness"
rust-version = "1.94"

[workspace.dependencies]
bytes = "1.11"
base64 = "0.22"
directories = "6.0"
fs2 = "0.4"
futures = "0.3"
lenso-agent-module = { path = "crates/lenso-agent-module" }
lenso-capability-secrets = { git = "https://github.com/LioRael/lenso-secrets-module.git", rev = "b404598383042138f3bcb90ec2a4f5f312ada1b2" }
lenso-app-plan = "0.1.4"
lenso = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "a6fdfd4081c4f6c71be1aad7d46bee72fff6d337" }
lenso-contract-authoring = { git = "https://github.com/LioRael/lenso-protocols", rev = "801353949443a32df70ea0730b3093fcafb30401" }
lenso-contract-codegen = { git = "https://github.com/LioRael/lenso-protocols", rev = "801353949443a32df70ea0730b3093fcafb30401" }
lenso-contract-runtime = "0.1.0"
lenso-kernel = "0.1.8"
lenso-guest-sdk = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "a6fdfd4081c4f6c71be1aad7d46bee72fff6d337" }
lenso-module-authoring = { git = "https://github.com/LioRael/lenso-protocols", rev = "801353949443a32df70ea0730b3093fcafb30401" }
lenso-native-adapter = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "a6fdfd4081c4f6c71be1aad7d46bee72fff6d337" }
lenso-plugin-bundle = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "6d504b530b268fe6b08b5b4253956af05697f733" }
lenso-plugin-control-plane = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "a6fdfd4081c4f6c71be1aad7d46bee72fff6d337" }
lenso-quickjs-adapter = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "a6fdfd4081c4f6c71be1aad7d46bee72fff6d337" }
lenso-runner = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "a6fdfd4081c4f6c71be1aad7d46bee72fff6d337" }
lenso-runtime-codec = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "a6fdfd4081c4f6c71be1aad7d46bee72fff6d337" }
lenso-wasm-component-adapter = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "a6fdfd4081c4f6c71be1aad7d46bee72fff6d337" }
nix = { version = "0.31", features = ["process", "signal"] }
lenso-secrets-env-module = { git = "https://github.com/LioRael/lenso-secrets-module.git", rev = "b404598383042138f3bcb90ec2a4f5f312ada1b2" }
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls", "stream"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.48", features = ["io-util", "macros", "net", "process", "rt", "signal", "time"] }
uuid = { version = "1.18", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
single_match_else = "allow"
