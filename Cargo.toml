    "crates/lenso-capability-agent-tool-hook",
    "crates/lenso-capability-agent-workspace-read",
    "crates/lenso-capability-agent-tools",
    "crates/lenso-capability-agent-tool-provider",
    "crates/lenso-capability-agent-tool-progress",
    "crates/lenso-capability-agent-user-interaction",
    "crates/lenso-capability-agent-session",
    "crates/lenso-capability-agent-turn-input",
    "crates/lenso-capability-agent-task-supervisor",
    "crates/lenso-capability-agent-worktree",
    "crates/lenso-capability-agent-tui-contribution",
    "crates/lenso-capability-agent-tui-suggestion",
    "crates/lenso-agent-loop-plugin",
    "crates/lenso-agent-context-compaction-plugin",
    "crates/lenso-agent-context-compaction-command-plugin",
    "crates/lenso-agent-memory-sqlite-plugin",
    "crates/lenso-agent-memory-command-plugin",
    "crates/lenso-agent-session-presentation-plugin",
    "crates/lenso-agent-session-presentation-model-plugin",
    "crates/lenso-agent-mcp-client-plugin",
    "crates/lenso-agent-model-fixture-plugin",
    "crates/lenso-agent-model-openai-compatible-plugin",
    "crates/lenso-agent-model-openai-codex-direct-plugin",
    "crates/lenso-agent-native-support",
    "crates/lenso-agent-prompt-filesystem-plugin",
    "crates/lenso-agent-prompt-plugin",
    "crates/lenso-agent-prompt-static-plugin",
    "crates/lenso-agent-workspace-instructions-plugin",
    "crates/lenso-agent-process-native-plugin",
    "crates/lenso-agent-process-sandbox-plugin",
    "crates/lenso-agent-process-tools-plugin",
    "crates/lenso-agent-git-tools-plugin",
    "crates/lenso-agent-session-file-plugin",
    "crates/lenso-agent-session-inspection",
    "crates/lenso-agent-session-sqlite-plugin",
    "crates/lenso-agent-skills-filesystem-plugin",
    "crates/lenso-agent-subagent-tools-plugin",
    "crates/lenso-agent-worktree-provider-plugin",
    "crates/lenso-agent-tools-plugin",
    "crates/lenso-agent-text-tools-plugin",
    "crates/lenso-agent-tool-sdk",
    "crates/lenso-agent-tool-sdk-macros",
    "crates/lenso-agent-workspace-edit-plugin",
    "crates/lenso-agent-workspace-import-read-plugin",
    "crates/lenso-agent-workspace-read-tools-plugin",
