[workspace]
resolver = "2"
members = [
    "apps/lenso-agent-cli",
    "crates/lenso-agent-auth-openai-codex-module",
    "crates/lenso-capability-agent",
    "crates/lenso-capability-agent-auth-openai-codex",
    "crates/lenso-capability-agent-model",
    "crates/lenso-capability-agent-prompt",
    "crates/lenso-capability-agent-prompt-provider",
    "crates/lenso-capability-agent-process",
    "crates/lenso-capability-agent-workspace-read",
    "crates/lenso-capability-agent-tools",
    "crates/lenso-capability-agent-tool-provider",
    "crates/lenso-capability-agent-session",
    "crates/lenso-capability-agent-tui-contribution",
    "crates/lenso-agent-loop-module",
    "crates/lenso-agent-model-fixture-module",
    "crates/lenso-agent-model-openai-compatible-module",
    "crates/lenso-agent-model-openai-codex-direct-module",
    "crates/lenso-agent-native-support",
    "crates/lenso-agent-prompt-filesystem-module",
    "crates/lenso-agent-prompt-module",
    "crates/lenso-agent-prompt-static-module",
    "crates/lenso-agent-process-native-module",
    "crates/lenso-agent-process-tools-module",
    "crates/lenso-agent-session-file-module",
    "crates/lenso-agent-skills-filesystem-module",
    "crates/lenso-agent-tools-module",
    "crates/lenso-agent-text-tools-module",
    "crates/lenso-agent-workspace-edit-module",
    "crates/lenso-agent-workspace-import-read-module",
    "crates/lenso-agent-workspace-read-module",
    "crates/lenso-agent-cli-module",
    "crates/lenso-agent-tui-module",
    "crates/lenso-agent-tui-static-module",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/LioRael/lenso-agent-harness"
rust-version = "1.94"

[workspace.dependencies]
bytes = "1.11"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0"
fs2 = "0.4"
futures = "0.3"
lenso-capability-secrets = { git = "https://github.com/LioRael/lenso-secrets-module.git", rev = "a783eef6a7426a55a218c9e44335324d640061a4" }
lenso-app-plan = "0.1.5"
lenso = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "ffb07bc8dc7103b58c864b59225ca0f4609b6fdf" }
lenso-contract-authoring = { git = "https://github.com/LioRael/lenso-protocols", rev = "1424ffe25f05c0d3aaf746fb7fd66b26b9f803e0" }
lenso-contract-codegen = { git = "https://github.com/LioRael/lenso-protocols", rev = "1424ffe25f05c0d3aaf746fb7fd66b26b9f803e0" }
lenso-contract-runtime = "0.1.0"
lenso-guest-sdk = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "ffb07bc8dc7103b58c864b59225ca0f4609b6fdf" }
lenso-kernel = "0.1.11"
lenso-module-authoring = { git = "https://github.com/LioRael/lenso-protocols", rev = "1424ffe25f05c0d3aaf746fb7fd66b26b9f803e0" }
lenso-native-adapter = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "ffb07bc8dc7103b58c864b59225ca0f4609b6fdf" }
lenso-plugin-bundle = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "ffb07bc8dc7103b58c864b59225ca0f4609b6fdf" }
lenso-plugin-control-plane = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "ffb07bc8dc7103b58c864b59225ca0f4609b6fdf" }
lenso-quickjs-adapter = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "ffb07bc8dc7103b58c864b59225ca0f4609b6fdf" }
lenso-runner = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "ffb07bc8dc7103b58c864b59225ca0f4609b6fdf" }
lenso-runtime-codec = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "ffb07bc8dc7103b58c864b59225ca0f4609b6fdf" }
lenso-wasm-component-adapter = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "ffb07bc8dc7103b58c864b59225ca0f4609b6fdf" }
nix = { version = "0.31", features = ["process", "signal"] }
lenso-secrets-env-module = { git = "https://github.com/LioRael/lenso-secrets-module.git", rev = "a783eef6a7426a55a218c9e44335324d640061a4" }
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls", "stream"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", features = ["asm"] }
tempfile = "3.23"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.48", features = ["io-util", "macros", "net", "process", "rt", "signal", "time"] }
uuid = { version = "1.18", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
single_match_else = "allow"

# Host startup verifies large debug executables; keep that integrity path fast.
[profile.dev.package.sha2]
opt-level = 3
