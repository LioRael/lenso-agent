[package]
name = "external-wasm-workspace-reader"
version = "1.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
lenso-capability-agent-workspace-read = { git = "https://github.com/LioRael/lenso-agent-harness.git", rev = "752903cd78a6f76a616a15d8fcf183ae54c4547e" }
lenso-guest-sdk = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "61502d0b575dca5102fbf7625dbab45a8389180d" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.60"

[workspace]
