[package]
name = "dev-example-portable-text-tools"
version = "1.0.0"
edition = "2024"
publish = false

[package.metadata.lenso]
plugin-id = "dev.example.portable-text-tools"
root-slot = "tool-providers"

[package.metadata.lenso-cli]
outputs = ["wasm", "process"]

[lib]
crate-type = ["cdylib"]

[dependencies]
lenso = { package = "lenso-plugin-sdk", version = "0.2.0" }
lenso-agent-tool-sdk = { path = "../../../crates/lenso-agent-tool-sdk" }
schemars = "1"
serde = { version = "1", features = ["derive"] }

[[bin]]
name = "dev-example-portable-text-tools"
path = "src/main.rs"

[workspace]
