[package]
name = "lenso-agent-management-tools-plugin"
version = "0.1.0"
description = "Opt-in Tool Provider for the bound application's controlled Management Capability."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.lenso]
plugin-id = "lenso.agent.management-tools"
root-slot = "tool-providers"

[dependencies]
lenso.workspace = true
lenso-kernel.workspace = true
lenso-capability-agent-tool-provider = { path = "../lenso-capability-agent-tool-provider" }
lenso-capability-management.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true

[dev-dependencies]
lenso-app-plan.workspace = true
lenso-native-adapter.workspace = true
lenso-runner.workspace = true
tokio.workspace = true
