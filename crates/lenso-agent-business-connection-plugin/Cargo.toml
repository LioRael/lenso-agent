[package]
name = "lenso-agent-business-connection-plugin"
version = "0.1.0"
description = "Browser consent and per-turn credential custody for business App tools."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
[package.metadata.lenso]
plugin-id = "lenso.agent.business-connection"
root-slot = "tool-providers"
[dependencies]
lenso-auth-sdk = "0.2.3"
lenso.workspace = true
lenso-kernel.workspace = true
lenso-capability-agent-prompt-provider = { path = "../lenso-capability-agent-prompt-provider" }
lenso-capability-agent-auth-connection = { path = "../lenso-capability-agent-auth-connection" }
lenso-capability-agent-turn-binding = { path = "../lenso-capability-agent-turn-binding" }
lenso-capability-agent-tool-provider = { path = "../lenso-capability-agent-tool-provider" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
time = { workspace = true, features = ["parsing"] }
zeroize = "1"
[dev-dependencies]
axum.workspace = true
lenso-app-plan.workspace = true
lenso-native-adapter.workspace = true
lenso-runner.workspace = true
[lints]
workspace = true
